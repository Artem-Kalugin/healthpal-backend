services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: healthpal-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-healthpal}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-healthpal}
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      
      OTP_TTL: ${OTP_TTL:-600}
      RECOVERY_TTL: ${RECOVERY_TTL:-3600}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - healthpal-network
    
    volumes:
      - /app/node_modules 
      - uploads_data:/app/Uploads
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    build: 
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    container_name: healthpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-healthpal}
      POSTGRES_INITDB_ARGS: >
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        --locale=ru_RU.UTF-8
        --encoding=UTF8
        --lc-collate=ru_RU.UTF-8
        --lc-ctype=ru_RU.UTF-8
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-healthpal} -d ${DATABASE_NAME:-healthpal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - healthpal-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: healthpal-redis
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - healthpal-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: healthpal-ngrok
    restart: unless-stopped
    command: 
      http app:3000 
      --authtoken=${NGROK_AUTH_TOKEN}
      --log=stdout
    
    environment:
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN}
    
    depends_on:
      - app
    
    networks:
      - healthpal-network
    
    ports:
      - "4040:4040"  
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  healthpal-network:
    driver: bridge