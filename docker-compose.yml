x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthpal-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-healthpal}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-healthpal}
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      
      OTP_TTL: ${OTP_TTL:-600}
      RECOVERY_TTL: ${RECOVERY_TTL:-3600}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - healthpal-network

    ports:
      - "127.0.0.1:3000:3000"
    
    volumes:
      - uploads_data:/app/uploads
    
    logging: *default-logging


  postgres:
    image: postgres:17-bookworm
    container_name: healthpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-healthpal}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-healthpal}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=und --locale=C.UTF-8

    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-healthpal} -d ${DATABASE_NAME:-healthpal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - healthpal-network
    
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: healthpal-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - healthpal-network
    
    logging: *default-logging

  ngrok:
    image: ngrok/ngrok:3
    container_name: healthpal-ngrok
    restart: unless-stopped
    command: http app:3000 --log=stdout

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN:?NGROK_AUTH_TOKEN is required}
    
    depends_on:
      - app
    
    networks:
      - healthpal-network
    
    ports:
      - "127.0.0.1:4040:4040"
    
    logging: *default-logging

  seed:
    build:
      context: .
      dockerfile: ./docker/seed/Dockerfile
    container_name: healthpal-seed
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-healthpal}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:-healthpal}
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads
    
    networks:
      - healthpal-network
    
    profiles:
      - seed

volumes:
  postgres_data:
  uploads_data:
  redis_data:

networks:
  healthpal-network:
