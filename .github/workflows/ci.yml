name: Node.js CI

on:
  pull_request:
    branches: [ main ]
  # CD waits for this workflow to finish on main
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm build
    - run: pnpm lint

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm test
    # Postgres (ICU, C.UTF-8) and Redis for integration and e2e tests
    - run: pnpm test:db:up
    - run: pnpm test:int
    - run: pnpm test:e2e
    - if: always()
      run: pnpm test:db:down
