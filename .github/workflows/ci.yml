name: Node.js CI

on:
  pull_request:
    branches: [ main ]
  # CD waits for this workflow to finish on main
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm build
    - run: pnpm lint

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm test
    # Postgres (ICU, C.UTF-8) and Redis for integration and e2e tests
    - run: pnpm test:db:up
    - run: pnpm test:int
    - run: pnpm test:e2e
    - if: always()
      run: pnpm test:db:down
