name: Node.js CD

on:
  workflow_run:
    workflows: [ Node.js CI ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    # deploy only after a green CI on push to main
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            cd ~/healthpal-backend || { echo "❌ Directory not found"; exit 1; }
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard "$DEPLOY_SHA"
            git status
            
            echo "🔨 Building Docker images..."
            docker compose build --no-cache
            
            echo "🟢 Starting containers..."
            docker compose down --remove-orphans || true
            docker compose up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 5
            
            echo "📊 Container status:"
            docker compose ps
            
            echo "🔍 Checking ngrok service..."
            if docker compose ps | grep -q "healthpal-ngrok"; then
              echo "✅ ngrok is running"
              
              # Try to get the URL (with retries)
              for i in {1..10}; do
                NGROK_URL=$(docker compose logs ngrok 2>/dev/null | grep -oP 'URL.*https://\K[^ ]+' | tail -1)
                if [ -n "$NGROK_URL" ]; then
                  echo "✅ App deployed at: https://$NGROK_URL"
                  break
                fi
                echo "⏳ Waiting for ngrok URL... ($i/10)"
                sleep 2
              done
              
              if [ -z "$NGROK_URL" ]; then
                echo "⚠️  Could not retrieve ngrok URL, but deployment succeeded"
                echo "🔗 Check ngrok dashboard: http://$(hostname -I | awk '{print $1}'):4040"
              fi
            else
              echo "⚠️  ngrok service not found, but other services are running"
              docker compose logs ngrok 2>&1 | tail -20
            fi
            
            echo "✅ Deployment completed!"