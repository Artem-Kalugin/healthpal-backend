name: Node.js CD

on:
  workflow_run:
    workflows: [ Node.js CI ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    # deploy only after a green CI on push to main
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            cd ~/healthpal-backend || { echo "❌ Directory not found"; exit 1; }
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard "$DEPLOY_SHA"
            git status
            
            echo "🔨 Building Docker images..."
            docker compose build
            
            # the tunnel runs only here, never on a developer machine (see the ngrok service in docker-compose.yml)
            export COMPOSE_PROFILES=tunnel

            echo "🟢 Starting containers..."
            docker compose down --remove-orphans || true
            echo "⏳ Waiting for services to become healthy..."
            docker compose up -d --wait --wait-timeout 180

            echo "📊 Container status:"
            docker compose ps

            echo "🔍 Checking ngrok tunnel..."
            NGROK_URL=""
            for i in {1..15}; do
              NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -oE '"public_url":"https://[^"]+"' | head -1 | cut -d'"' -f4 || true)
              [ -n "$NGROK_URL" ] && break
              echo "⏳ Waiting for ngrok tunnel... ($i/15)"
              sleep 2
            done

            if [ -z "$NGROK_URL" ]; then
              echo "❌ ngrok tunnel is not up (ERR_NGROK_334 means another agent holds the domain)"
              docker compose logs ngrok 2>&1 | tail -20
              exit 1
            fi

            echo "✅ App deployed at: $NGROK_URL"
            echo "✅ Deployment completed!"